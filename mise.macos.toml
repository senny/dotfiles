# macOS-specific mise configuration

[tools]
opencode = "latest"
pi = "latest"

[plugins]
postgres = "git@github.com:senny/asdf-postgres-app.git"

[dotfiles]
"~/.emacs.d" = "emacs.d"
"~/.pi/agent/settings.json" = "config/pi/settings.json"

[bootstrap.packages]
"brew:fish" = "latest"
"brew:git" = "latest"
"brew:lazygit" = "latest"
"brew:ripgrep" = "latest"
"brew:starship" = "latest"
"brew:zellij" = "latest"
"brew-cask:alacritty" = { version = "latest", os = "macos", adopt = true }
"brew-cask:postgres-app" = { version = "latest", os = "macos", adopt = true }

[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
tilesize = 52
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "list"
