min_version = "2026.8.0"

[plugins]
postgres = "git@github.com:senny/asdf-postgres-app.git"

[tools]
ruby = "4.0.6"
python = "3.13.2"

[bootstrap.packages]
"brew:fish" = "latest"
"brew:git" = "latest"
"brew:ripgrep" = "latest"
"brew:starship" = "latest"
"brew:zellij" = "latest"
"brew-cask:alacritty" = { version = "latest", os = "macos", adopt = true }
"brew-cask:postgres-app" = { version = "latest", os = "macos", adopt = true }

[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
tilesize = 52
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "list"

[settings]
dotfiles.default_mode = "symlink"

[vars]
git_name = { required = "Set git_name in mise.local.toml" }
git_email = { required = "Set git_email in mise.local.toml" }

[dotfiles]
"~/.agignore" = "agignore"
"~/.alacritty.toml" = "alacritty.toml"
"~/.bash_profile" = "bash_profile"
"~/.emacs.d" = "emacs.d"
"~/.gemrc" = "gemrc"
"~/.git-hooks" = "git-hooks"
"~/.gitignore" = "gitignore"
"~/.irbrc" = "irbrc"
"~/.rspec" = "rspec"
"~/.rubocop.yml" = "rubocop.yml"
"~/.tool-versions" = "tool-versions"
"~/.zshrc" = "zshrc"
"~/.config/fish" = "config/fish"
"~/.config/starship.toml" = "config/starship.toml"
"~/.config/zellij" = "config/zellij"
"~/Library/Application Support/Code/User/settings.json" = "vscode/settings.json"
"~/Library/Application Support/Code/User/keybindings.json" = "vscode/keybindings.json"
"~/.gitconfig" = { source = "gitconfig.tmpl", mode = "template" }
