schemaVersion: "1"
agent: pi
workspace: ${{ env.projectDir }}

# pi's state (settings.json, models-store.json, sessions/) lives in
# the pi-config checkout, so mount it and point pi at it. Direct mounts keep
# the host path, which is why the absolute `fileDir`-based value below works.
additionalWorkspaces:
  - path: Work/pi-config

lifecycle:
  postCreate:
    # `herdr machine add` connects to the sandbox over SSH using the
    # `<name>.sbx` alias. That alias only resolves after `sbx setup ssh` has
    # written the generated SSH client config, so it has to run first.
    # `sbx setup ssh` is idempotent, so re-running it on every create is safe.
    - name: Set up sandbox SSH access
      command: sbx setup ssh
      timeout: 1m
    - command: herdr machine add "$SBX_SANDBOX_NAME.sbx" --label "$SBX_SANDBOX_NAME"
      timeout: 2m
  preRemove:
    - command: herdr machine list --json | jq -r '.[] | select(.label=="'"$SBX_SANDBOX_NAME"'") | .id' | xargs -r herdr machine remove
      timeout: 1m

kits:
  - source: ${{ env.fileDir }}/Work/pi-config/sbx/pi
    args:
      config_dir: ${{ env.fileDir }}/Work/pi-config
  - ${{ env.fileDir }}/Work/pi-config/sbx/basecamp
